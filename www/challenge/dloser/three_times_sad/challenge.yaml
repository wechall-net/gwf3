    info_html: Below are three encrypted messages intercepted in a recent raid. Our latest information suggest the sender
      uses OTPs using 64-bit LFSR (key byte stream is generated msb first) and that he was setting up some kind of <hint>teleconferencing</hint>.<br/><br/>There
      is also talk of a master key. We would be very grateful if you can find it for us.<br/>
