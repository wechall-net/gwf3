translations:
  en:
    index_info: You, Chell want to destroy GLaDOS. For this mission you have to steal the cookie from GLaDOS in order to get
      access to the mainframe in the Enrichment Center. If you can access the mainframe, you can shutdown GLaDOS and you will
      be rescued.<br/><br/>You have found a source code for a web application, which is vulnerable to sql-injection and xss
      attacks. This web application runs on the <a href="{experience}">mainframe (accessible only from the internal network).</a>
      <a href="{experience_source}"> Here you can download the source code.</a><br/><br/>Bad news are that you can't access
      the mainframe without the cookie, only GLaDOS can. Another bad news are that the www-user has only read access on the
      mainframe database, and stacking the queries is not working.<br/><br/>You have read the protocols that if GLaDOS receives
      a new e-mail with an id in it, GLaDOS will visit the experience web application above, enter the id and click on the
      first link in order to gather information about the new experience subject.<br/><br/>During your mission you have successfully
      accessed a test webserver, and setup a php file, which can be accessed from the internal network via this link:<br/><i>http://test.cake/steal_cookie.php</i><br/><a
      href="{cookie_source}">This php file</a> can receive the "cookie" get parameter and record the values in a file, which
      is accessible for you.<br/><br/>Your mission is to send a special id to <a href="{author}">GLaDOS</a>, in order to steal
      the cookie data.<br/>(*write Z a PM with the challenge title as subject)<br/>After successfully exploiting the web application
      and GLaDOS itself, you will receive your cake. I mean your cookie. Good luck!<br/><br/><b>Additional information:</b><br/><b>magic_quotes_gpc
      is off on the mainframe</b><br/>
  it:
    index_info: Tu, Chell vuoi distruggere GLaDOS. Per questa missione dovrai rubare il cookie da GLaDOS per ottenere l'accesso
      al mainframe nel Centro di Arricchimento. Se puoi accedere al mainframe, puoi spegnere GLaDOS e sarai recuperato.<br/><br/>Hai
      trovato il sorgente di una Web Application, vulnerabile a SQL injection e attacchi XSS. Questa Web Application gira
      sul <a href="{experience}">mainframe (accessibile solo dalla rete interna).</a> <a href="{experience_source}"> Qui puoi
      scaricare il codice sorgente.</a><br/><br/>La brutta notizia è che non puoi accedere al mainframe senza il cookie, solo
      GLaDOS può. Un'altra brutta notizia è che l'utente www-user ha solo il permesso di lettura su database del mainframe
      e non è possibile eseguire più query con la stessa richiesta.<br/><br/>Hai letto i protocolli e, secondi questi ultimi,
      se GLaDOS riceve una nuova E-Mail con un id in essa, GLaDOS visiterà la web application d'esperienza anzidetta, inserirà
      l'id e cliccherà sul primo link per acquisire informazioni relative al nuovo soggetto d'esperienza.<br/><br/>Durante
      la tua missione hai ottenuto l'accesso ad un webserver di prova ed hai installato un file php, a cui si può accedere,
      tramite la rete locale, utilizzando questo link:<br/><i>http://test.cake/steal_cookie.php</i><br/><a href="{cookie_source}">Questo
      file php</a> può ricevere il paramtero GET "cookie" e salvare il suo valore in un file, accessibile anche a te.<br/><br/>La
      tua missione è quella di mandare un id speciale a <a href="{author}">GLaDOS</a>, per rubare il valore del cookie.<br/>(*scrivi
      a Z un PM con il titolo della sfida come oggetto)<br/>Dopo aver sfruttato con successo l'applicazione web e GLaDOS stesso,
      riceverai la tua torta. Intendevo il tuo cookie. Buona fortuna!<br/><br/><b>Ulteriori informazioni:</b><br/><b>magic_quotes_gpc
      è disabilitato sul mainframe</b><br/>
