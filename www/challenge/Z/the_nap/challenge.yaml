translations:
  de:
    title: Das Nickerchen
    info_html: |
      Du wachst um Vier Uhr Morgens auf und stellst traurig fest, dass wieder ein langweiliger Arbeitstag ansteht.<br/>
      Du machst dir Frühstück und liest deine Lieblingszeitung "Der Angriff".<br/>
      Es ist der 5. Juni 1944. Die Nachrichten sagen voraus, dass es in den nächsten Tagen keine Invasionen geben wird.<br/>
      Sogar dein Boss hat zur Zeit Urlaub. Du kommst um Fünf Uhr bei der Wehrmacht an, <br/>
      der Kollege von der Nachtschicht begrüsst dich und überreicht dir die täglichen Codes.<br/>
      Daraufhin verlässt er schnell die Kommunikationszentrale.<br/>
      Er ist wirklich ein fauler Zeitgenosse und hat die Enigma-Einstellungen für heute natürlich noch nicht eingegeben.<br/>
      Du denkst, heute wird mal wieder ein richtig fauler Arbeitstag - allein.<br/>
      Du trinkst erstmal ein Bier und wartest auf eingehende Nachrichten. Weil nichts passiert<br/>
      schlummerst du ein. Du träumst gut, aber plötzlich klingelt das Radio.<br/>
      Als du aus deinen Träumen erwachst, schüttest du dein Bier um und es durchweicht das tägliche Codebuch.<br/>
      Du fluchst, nimmst das Radio und zeichnest die verschlüsselte Nachricht auf:<br/>
      <br/>
      <pre style="margin: 8px 12px">
      U17 DE U101 0600 = 4 = VRS SDX =
      JSPK NIPN OZTR CYEW QICZ PDNO KRBU AXKE VTIS
      HIDE WZOY PGZN ERCY ADWI FTOB FYSL SKTD MLJX
      XVSZ JXCW BKNV IJMG RFOV YWYZ CKOZ ZPIV JLEN
      ZUUX NEAP QGOV
      </pre>
      Nach dem Aufzeichnen bemerkst du, dass die Schlüssel für heute teilweise zerstört wurden.<br/>
      Du kannst dir vorstellen das dein Vorgesetzter sehr wütend sein wird, wenn er zurückkehrt,<br/>
      falls du es nicht schaffst die Nachricht davor zu entschlüsseln.<br/>
      Das versaute Codebuch ist hier: <a href="{codebook}">Codebuch</a>;<br/>
      <br/>
      Deine Aufgabe ist die Nachricht zu entschlüsseln. Die Lösung<br/>
      ist das letzte deutsche Wort, kleingeschrieben, und <br/>
      die gesamte Anzahl der möglichen Einstellungen in bits angehängt - falls die Verdrahtung der Rotoren geheim ist.<br/>
      <br/>
      Zum Beispiel hat AES128 128 bits. Also wenn das letzte deutsche Wort &quot;WeChall&quot; ist und<br/>
      die Anzahl der möglichen Einstellungen in bits 128 beträgt, lautet die Lösung:<br/>
      wechall128<br/>
      </div>
      <div><i>Kein einziger Biertropfen wurde für das erstellen dieser Challenge verschwendet :)</i></div>
  en:
    title: The Nap
    info_html: |
      You wake up at 4 a.m. and sadly realise, that it is another day to work.<br/>
      You make your breakfast, and read your favourite newspaper "Der Angriff".<br/>
      The date is 5th June 1944. The news predicts there will be no invasion for several days.<br/>
      Even your boss is away for vacation. You arrive zur Wehrmacht at 5 a.m., and<br/>
      the night shift collegaues greets you. He gives you the daily codes<br/>
      and leaves immediately the communication station.<br/>
      He is really a lazy guy and havent established the enigma settings yet.<br/>
      You really think its gonna be a lazy day - alone.<br/>
      You drink some beer and wait for incoming messages. As nothing happens,<br/>
      you happen to fall asleep. You dream very well but suddenly the radio begins to ring.<br/>
      As you wake up from your deep dream you knock your beer and it soaks the daily codebook.<br/>
      You say some round oath, pick up the radio and record the encrypted message:<br/>
      <br/>
      <pre style="margin: 8px 12px">
      U17 DE U101 0600 = 4 = VRS SDX =
      JSPK NIPN OZTR CYEW QICZ PDNO KRBU AXKE VTIS
      HIDE WZOY PGZN ERCY ADWI FTOB FYSL SKTD MLJX
      XVSZ JXCW BKNV IJMG RFOV YWYZ CKOZ ZPIV JLEN
      ZUUX NEAP QGOV
      </pre>
      After the conversation you realise that the keys for today were partially destroyed.<br/>
      You imagine how angry your superior will be after returning,<br/>
      if you don't decrypt the message immediately.<br/>
      The wasted codebook is here: <a href="{codebook}">codebook</a>;<br/>
      <br/>
      Your job is to decipher the encrypted message, and the solution is<br/>
      the last original german word in lowercase concatenated with<br/>
      the total number of possible configurations in bits - if the wiring of the rotors<br/>
      is secret.<br/>
      <br/>
      For example AES128 has 128 bits. So if the last original german word is &quot;WeChall&quot; and<br/>
      the total number of possible configurations in bits is 128 the solution is:<br/>
      wechall128<br/>
      </div>
      <div><i>Not a single beer-drop has been wasted during the making of this challenge :)</i></div>
  it:
    title: Il sonnellino
    info_html: |
      Ti svegli alle quattro di mattina e realizzi, purtroppo, che è un altro giorno di lavoro.<br/>
      Mentre fai colazione, leggi il tuo giornale preferito "Der Angriff".<br/>
      La data è il 5 Giugno 1944. Le news dicono che non ci sarà alcuna invasione per molti giorni a venire.<br/>
      Anche il tuo boss è in vacanza. Arrivi a zur Wehrmacht alle cinque di mattina <br/>
      e il collega del turno di notte ti saluta, ti da i codici giornalieri<br/>
      e se ne va immediatamente dalla stazione comunicazioni.<br/>
      E' proprio un tipo pigro e non ha ancora impostato correttamente la macchina Enigma.<br/>
      Pensi proprio che sarà una giornata noiosa... e solitaria.<br/>
      Bevi una birra e aspetti che arrivi qualche messaggio. Siccome non accade nulla,<br/>
      ti appisoli. Nel bel mezzo di un sogno magnifico, la radio comincia a gracchiare.<br/>
      Mentre ti risvegli dal sogno, urti la birra che finisce sul libro dei codici giornalieri,<br/>
      inzuppandolo. Imprecando, prendi la radio e trascrivi il messaggio criptato:<br/>
      <br/>
      <pre style="margin: 8px 12px">
      U17 DE U101 0600 = 4 = VRS SDX =
      JSPK NIPN OZTR CYEW QICZ PDNO KRBU AXKE VTIS
      HIDE WZOY PGZN ERCY ADWI FTOB FYSL SKTD MLJX
      XVSZ JXCW BKNV IJMG RFOV YWYZ CKOZ ZPIV JLEN
      ZUUX NEAP QGOV
      </pre>
      Dopo la conversazioni ti accorgi che parte delle chiavi odierne è stata distrutta.<br/>
      Immagini quanto si arrabbierà il tuo superiore al suo ritorno,<br/>
      se non decritti il messaggio immediatamente.<br/>
      Il libro dei codici danneggiato è qui: <a href="{codebook}">libro dei codice</a>;<br/>
      <br/>
      Il tuo compito è di decifrare il messaggio crittato e la soluzione è<br/>
      l'ultima parola in tedesco, in minuscolo, concatenata con il numero totale di <br/>
      configurazioni possibili in bit - se il cablaggio dei rotori è segreto.<br/>
      <br/>
      Ad esempio: AES128 ha 128 bit. Per cui, se l'ultima parola in tedesco è &quot;WeChall&quot; e<br/>
      il numero totale di possibili configurazioni in bit è 128, la soluzione sarà:<br/>
      wechall128<br/>
      </div>
      <div><i>Non un singolo goccio di birra è stato sprecato durante la realizzazione di questa sfida :)</i></div>
