    info_html: |-
      Hello {name}<br/>
      <br/>
      To speed up our websites, we decided to store sessions inside the browser's cookies.<br/>
      The cookies are encrypted, so nobody should be able to temper with them.<br/>
      However, some user was able to impersonate as another one, despite the encryption!<br/>
      <br/>
      Can you reproduce this? If so, <a href="{login}">login as the user 'System'</a>.<br/>
      As a starting point, try to login as user:user<br/>
      You are also given <a href="{github}">the source</a> for the cookie library and site login.<br/>
      <br/>
      Good Luck!<br/>
      gizmore
