  it:
    title: 'The Travelling Customer '
    info_html: 'In questa sfida di programmazione devi risolvere il seguente problema:<br/>Ti viene presentata un menù, un
      NumOggetti e una Somma, insieme ad un parametro di Stock.<br/>Il tuo compito consiste nel selezionare <i>NumOggetti</i>
      oggetti spendendo la somma data.<br/>Non potrai scegliere più di <i>Stock</i> oggetti di ogni tipo.<br/><br/>Esempio:<br/>Patatine=4<br/>Uova=2<br/><br/>NumOggetti=5<br/>Somma=14<br/>Stock=3<br/>Livello=1<br/><br/>Una
      risposta accettabili sarebbe: 2Patatine3Uova<br/><br/>Visita <a href="{problem}">{problem}</a> per richiedere un nuovo
      problema.<br/>Invia le tue risposte a <a href="{answer}">{answer}?answer=[risposta]</a> con il formato NNomeoggettoNNomeoggetto.<br/>Devi
      risolvere {count} problemi ed il tempo limite per ogni problema è {timeout} secondi.<br/><br/>Buona fortuna!'
