    title: The Travelling Customer
    info_html: 'In this programming challenge you need to solve the following problem:<br/>You are represented a pricelist,
      an itemamount and a sum, as well as the stock parameter.<br/>Your job is to select <i>itemamount</i> items which will
      result in the sum.<br/>You may not select more items than <i>stock</i> from each type.<br/><br/>Example:<br/>Chips=4<br/>Eggs=2<br/><br/>Items=5<br/>Sum=14<br/>Stock=3<br/>Level=1<br/><br/>An
      accepted answer would be: 2Chips3Eggs<br/><br/>Visit <a href="{problem}">{problem}</a> to request a new problem.<br/>Send
      your answers to <a href="{answer}">{answer}?answer=[answer]</a> with the format NItemnameNItemname.<br/>You need to
      solve {count} problems and your timelimit for each problem is {timeout} seconds.<br/><br/>Good Luck!'
