translations:
  en:
    title: WWW-Robots
    info_html: |
      In this little training challenge, you are going to learn about the <a href="http://en.wikipedia.org/wiki/Robots_exclusion_standard">Robots_exclusion_standard</a>.<br/>
      The robots.txt file is used by web crawlers to check if they are allowed to crawl and index your website or only parts of it.<br/>
      Sometimes these files reveal the directory structure instead protecting the content from being crawled.<br/><br/>
      Enjoy!
  de:
    title: WWW-Robots
    info_html: |
      In dieser kleine Aufgabe lernst du etwas über den <a href="http://de.wikipedia.org/wiki/Robots_Exclusion_Standard">Robots_exclusion_standard</a>.<br/>
      Die robots.txt Datei wird von Suchmaschinen ausgelesen um zu prüfen welche Dateien und Verzeichnisse auf Deiner Webseite durchsucht werden dürfen.<br/>
      Manchmal verrät man dadurch mehr als man versteckt.<br/><br/>
      Viel Spass!
  fr:
    title: WWW-Robots
    info_html: |
      Dans de petit challenge d'entraînement, vous allez vous familiariser sur le <br/><a href="http://fr.wikipedia.org/wiki/Protocole_d%27exclusion_des_robots">protocole d'exclusion des robots</a>.<br/>
      Le fichier robots.txt est utilisé par les robots d'indexation pour verifier s'ils sont autorisés d'explorer et d'indexer votre site internet ou seulement une partie de celui-ci.<br/>
      Quelquefois, ces fichiers révèlent la structure des dossiers au lieu de protéger leur contenu contre l'exploration.<br/><br/>
      Enjoy!
  it:
    title: WWW - Robots
    info_html: |
      In questa piccola sfida, imparerai qualcosa a riguardo del <a href="http://it.wikipedia.org/wiki/Protocollo_di_esclusione_robot">Protocollo di esclusione robot</a>.<br/>
      Il file robots è utilizzato dai web crawlers per controllare se sono autorizzati a navigare ed indicizzare tutto il tuo sito o solo parti di esso.<br/>
      A volte, questi file rivelano informazioni sulla struttura delle cartelle del sito invece che proteggere il sito stesso del crawling.<br/><br/>
      Buon divertimento!
