id: training.prime_factory
title: Prime Factory
score: 1
solution:
  type: plaintext
  value: '1'
translations:
  en:
    title: 'Training: Prime Factory'
    info_html: |
      Your task is simple:<br/>
      Find the first two primes above 1 million, whose separate digit sums are also prime.<br/>
      As example take 23, which is a prime whose digit sum, 5, is also prime.<br/>
      The solution is the concatination of the two numbers,<br/>
      Example: If the first number is 1,234,567<br/>
      and the second is 8,765,432,<br/>
      your solution is 12345678765432<br/>
  de:
    info_html: |
      Diese Aufgabe ist einfach:<br/>
      Finde die ersten beiden Primzahlen grösser als 1 Million, deren Quersumme auch eine Primzahl ist.<br/>
      Beispiel: 23 ist eine Primzahl, und die Quersumme 5 ist auch eine Primzahl.<br/>
      Die Lösung setzt sich aus den beiden Zahlen zusammen.<br/>
      Beispiel: Falls die erste Zahl 1,234,567 beträgt,<br/>
      und die zweite Zahl lautet 8,765,432,<br/>
      ist die Lösung 12345678765432<br/>
  fi:
    info_html: |
      Sinun tehtäväsi on yksinkertainen:<br/>
      Etsi kaksi ensimmäistä alkulukua yli 1 miljoonaa euroa, jonka erillinen numero summat ovat myös alkuluku.<br/>
      Kuten esimerkiksi ottaa 23, joka on tärkein, jonka numeron summa, 5, on myös alkuluku.<br/>
      Ratkaisu on concatination on kaksi numeroa,<br/>
      Esimerkki: Jos ensimmäinen numero on 1.234.567<br/>
      ja toinen on 8.765.432,<br/>
      ratkaisusi on 12345678765432<br/>
  fr:
    info_html: |
      Votre tâche est simple:<br/>
      Trouver les deux premiers nombres premiers de plus d'1 million, dont la somme de leurs chiffres est aussi un nombre premier.<br/>
      Par exemple 23 qui est premier, la somme de ses chiffres est 5 qui est aussi un nombre premier.<br/>
      La solution est la concaténation des deux nombres,<br/>
      Exemple: Si le premier nombre est 1 234 567<br/>
      et le second 8 765 432,<br/>
      Votre solution sera 12345678765432<br/>
  it:
    info_html: |
      La tua missione è semplice:<br/>
      Trova il primi due numeri primi sopra 1 milione, per cui la somma delle cifre che compongono il numero è anch'essa un numero primo.<br/>
      Ad esempio, prendi 23, che è un primo la cui somma delle cifre, 2+3=5, è anch'essa prima.<br/>
      La soluzione è la concatenazione dei due numeri,<br/>
      Esempio: Se il primo numero è 1'234'567<br/>
      ed il secondo è 8'765'432,<br/>
      la soluzione è 12345678765432<br/>
  tr:
    info_html: |
      Bu görev basittir:<br/>
      1 milyondan fazla ilk iki asal bul, rakamları toplamı da bir asal sayıdır.<br/>
      Örnek: 23 bir asal sayıdır ve toplam da ayrıca bir asal sayı 5'tir.<br/>
      Çözelti, iki sayı oluşmaktadır.<br/>
      Örnek: birinci sayı 1.234.567 ise,<br/>
      ve ikinci sayı olduğunu 8.765.432,<br/>
      çözelti12345678765432<br/>
