    alt_cherries: Cherries
    alt_hemps: Hemps
  de:
    title: Snake Für Arme
    info_html: 'Deine Aufgabe ist es, genau {score} Punkte zu erreichen. Du kannst <a href="{highscore}">hier die Höchstpunktzahlen
      einsehen</a>.<br/><br/><b>Spielanleitung</b>:<br/>- Klicke auf das Applet zum fokussieren. Danach drücke P oder F4 um
      das Spiel zu starten.<br/>- Benutze CrsrLinks und CrsrRechts um die Schlange zu drehen.<br/>- Benutze CrsrHoch und CrsrRunter
      um die Geschwindigkeit leicht anzupassen.<br/>- Krieche nicht in deine eigene Scheisse.<br/>- Die Schlange verhungert
      wenn du sie nicht fütterst.<br/>- Wenn du Hanf gefressen hast, ist die Steuerung vertauscht.<br/>- Sammele Buchstaben
      für Punkte-Multiplikator.<br/>- Hanf erhöht die Wahrscheinlichkeit auf Bonus-Buchstaben.<br/><br/><b>Notizen</b>:<br/>-
      Das Spiel bemerkt wenn du versuchst zu schummeln. Deine Aufgabe beinhaltet auch, dies zu umgehen.<br/>- Falls du <a
      href="{snake}">das alte Snake Applet</a> schon kennst: Die ''Schummel-Erkennung'' ist hier recht clever. Du kannst aber
      auch <a href="{cgi}">erstmal dein Glück mit der alten Highscore versuchen</a>, für leichtere Bedingungen.<br/>- Hier
      geht es nicht um eine SQL-Injection oder ähnliche Fehler, nur die ''Schummel-Erkennung''.<br/>- Drogen missbrauchen
      ist nicht gut für Dein geistiges Wohlbefinden.<br/><br/><b>Credits</b>:<br/>- 3D Früchte wurden von <i>Lazer</i> erstellt.<br/>-
      Der Hanf-Sound stammt mit freundlicher Genehmigung von <i>Kapt`n Olga - Molkerei auf der Bounty</i>.<br/>- Der Mampf-Sound
      stammt ohne Genehmigung aus <i>FTL`s Dungeon Master</i>.<br/>- livinskull (und andere) für das testen der Challenge.<br/>'
    alt_cheater: Schummler
    th_score: Punkte
    th_nick: Spitzname
    th_multi: Multi
    th_length: Länge
    hs_title: Snake Höchstpunktzahlen
    hs_info: 'Die Snake Highscore.<br/>Held des Tages: <b>{hero}</b>.<br/>Um alle Schummler zu löschen, <a href="{count}">klicke
