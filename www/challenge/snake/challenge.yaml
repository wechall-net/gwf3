  fi:
    title: Snake 4 Poors
    info_html: 'Sinun tehtäväsi on saavuttaa tarkalleen {score}-pistettä. Voit <a href="{highscore}"> katsella huipputulos
      taulukkoa tästä.</a>.<br/><br/><b>Peli ohjeet</b>:<br/>- Klikkaa applet keskittyä, paina P tai F4.<br/>- Käytä nuolinäppäimistön
      vasenta- ja oikeaanuolta kiertääksesi käärmettä.<br/>- Käytä nuolinäppäimistön ylös- ja alasnuolia säätääksesi nopeutta
      hieman.<br/>- Älä kävele omaan kakkaasi.<br/>- Käärme kuolee nälkään jos sinulla et ruoki sitä.<br/>- Hampun syöminen  vaihtaa
      oikean vasemmalle ja vasemman oikalle ohjauksessa.<br/>- Kerää kirjaimia saadaksesi pistekertoimia.<br/>- Hamppu lisää
      kirjainten ilmestymistiheyttä.<br/><br/><b>Huomioitavaa</b>:<br/>- Peli tunnistaa, jos olet huijannut oman huipputulos
      merkintäsi. Sinun tehtäväsi on myös kukistaa huijaus tunnistus.<br/>- Jos tiedät jo <a href="{snake}"> vanhan appletin
      </ a>: huijaaminen havaitseminen on viisaampi tässä. Mutta voit silti yrittää hakata <a href="{cgi}"> vanha huipputulos
      </ a>, ja helpompi versio.<br/>- Ei ole SQL Injection tai muut todelliset virhe, vain huijausta havaitsemista.<br/>-
      Huumeiden käyttöä ei ole hyväksi mielenterveydelle.<br/><br/><b>Credits</b>:<br/>- 3D hedelmät kehitti ystäväni<i>Lazer</i>.<br/>-
      Hamppu ääni otettiin luvalla<i>Kapt`n Olga - Molkerei auf der Bounty:stä</i>.<br/>-  Gulp syöminen ääni tehtiin ilman
      lupaa <i>FTL`s Dungeon Master:stä</i>.<br/>- Livinskull (ja muut) haasten testaamisesta.<br/>'
    alt_cheater: Cheater
