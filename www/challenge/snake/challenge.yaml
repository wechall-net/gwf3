translations:
  en:
    title: Snake 4 Poors
    info_html: 'Your mission is to reach exactly {score} points. You can <a href="{highscore}">watch the highscore table here</a>.<br/><br/><b>Game
      instructions</b>:<br/>- Click the applet to focus, then press P or F4.<br/>- Use cursor left and right to rotate the
      snake.<br/>- Use cursor up and down to adjust speed a little.<br/>- Do not walk into your own poo.<br/>- Snake will
      starve if you don`t feed it.<br/>- Eating hemp will switch the movement.<br/>- Collect bonus letters for score multipliers.<br/>-
      Hemp increases the chance for bonus letters.<br/><br/><b>Notes</b>:<br/>- The game will detect if you have cheated your
      highscore entry. Your mission is to defeat the cheater detection as well.<br/>- In case you already know <a href="{snake}">the
      old applet</a>: The cheating detection is more clever here. But you can still try to hack the <a href="{cgi}">old highscore</a>,
      for an easier version.<br/>- There is no sql injection or any other real flaw, just a cheating detection.<br/>- (Ab)using
      drugs is not good for your mental health.<br/><br/><b>Credits</b>:<br/>- 3D fruits were created by my friend <i>Lazer</i>.<br/>-
      Hemp sound was taken with permission from <i>Kapt`n Olga - Molkerei auf der Bounty</i>.<br/>- Gulp eating sound was
      taken without permission from <i>FTL`s Dungeon Master</i>.<br/>- livinskull (and others) for testing the challenge.<br/>'
    alt_cheater: Cheater
    th_score: Score
    th_nick: Nickname
    th_multi: Multi
    th_length: Length
    hs_title: Snake Highscore
    hs_info: 'The snake highscore.<br/>Hero of the day: <b>{hero}</b>.<br/>To delete all cheaters, <a href="{count}">press
