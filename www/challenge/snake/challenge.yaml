  it:
    title: 'Snake 4 Poors '
    info_html: 'La tua missione è di ottenere esattamente {score} punti. Puoi <a href="{highscore}">dare un occhiata alla
      tabella dei punteggi qui</a>.<br/><br/><b>Istruzioni del gioco</b>:<br/>- Clicca sull''applet per rendere le finestra
      attiva, poi premi P o F4.<br/>- Usa la freccia sinistra e la freccia destra per ruotare il serpente.<br/>- Usa la freccia
      su e freccia giu per aggiustare la velocità.<br/>- Non calpestare la tua scia.<br/>- Il serpente morirà di fame se non
      si nutre.<br/>- Mangiare canapa farà invertire il movimento.<br/>- Colleziona lettere bonus per avere un moltiplicatore
      punteggio.<br/>- La canapa aumenta le probabilità di lettere bonus.<br/><br/><b>Note</b>:<br/>- Il gioco controllerà
      se hai barato sul punteggio. La tua missione è quella di sconfiggere il meccanismo di rilevazione delle manomissioni.<br/>-
      Nel caso conoscessi già <a href="{snake}">il vecchio applet</a>: La rilevazione è molto più avanzata. Ma puoi cercare
      ancora di barare nella <a href="{cgi}">vecchia classifica</a>, per una versione più facile.<br/>- Non c''è nessuna possibilità
      di SQL injection o altro, solo la rilevazione di una eventuale manomissione del punteggio.<br/>- (Ab)usare di droghe
      non fa bene alla tua salute mentale.<br/><br/><b>Crediti</b>:<br/>- I frutti 3D sono stati creati dal mio amico <i>Lazer</i>.<br/>-
      Il suono della canapa è stato preso, con permesso, da <i>Kapt`n Olga - Molkerei auf der Bounty</i>.<br/>- Il suono dell''ingoioè
      stato preso, con permesso, da <i>FTL`s Dungeon Master</i>.<br/>- livinskull (e altri) per aver testato la sfida.<br/>'
    alt_cheater: Baro
    th_score: Punteggio
    th_nick: Nome utente
    th_multi: 'Multi '
    th_length: Lunghezza
    hs_title: Classifica di Snake
    hs_info: 'La classifica di Snake.<br/>Eroe del giorno: <b>{hero}</b>.<br/>Per cancellare tutti i bari, <a href="{count}">premi
